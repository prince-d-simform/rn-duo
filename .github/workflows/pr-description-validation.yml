name: PR Description Validation

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-claude-instructions:
    runs-on: ubuntu-latest
    steps:
      - name: Check CLAUDE.md exists and documents the code-review skill
        uses: actions/github-script@v7
        with:
          script: |
            const path = "CLAUDE.md";
            const errors = [];

            let content = null;
            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: context.payload.pull_request.head.sha,
              });
              content = Buffer.from(data.content, data.encoding).toString("utf8");
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            if (content === null) {
              errors.push(`\`${path}\` is missing. Please add it.`);
            } else {
              // The file must document the code-review skill (path or name), the
              // same way this repo's own CLAUDE.md points to
              // .github/skills/code-review/SKILL.md. Wording can differ; the
              // reference to the skill just needs to be present.
              const mentionsSkillPath = /skills\/code-review\/SKILL\.md/i.test(content);
              const mentionsSkillName = /code-review['"`]?\s*skill/i.test(content);
              if (!mentionsSkillPath && !mentionsSkillName) {
                const snippet = [
                  "```markdown",
                  "### 🔍 Code Review (Copilot Review Sessions)",
                  "**Use when working with:**",
                  "- Reviewing a pull request or working diff for correctness bugs and cleanups",
                  "- Deciding what to flag vs. skip during a Copilot review session",
                  "- Understanding this repo's review effort levels and inline-comment conventions",
                  "",
                  "Follow the `code-review` skill at [`.github/skills/code-review/SKILL.md`](.github/skills/code-review/SKILL.md) for the full checklist and workflow before posting review comments.",
                  "```",
                ].join("\n");
                errors.push(
                  `\`${path}\` does not document the \`code-review\` skill. Copy the block below and paste it into \`${path}\`:\n\n${snippet}`
                );
              }
            }

            if (errors.length) {
              const message = [
                "### ❌ CLAUDE.md validation failed",
                "",
                ...errors.map(e => `- ${e}`),
              ].join("\n");

              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
              });
              const existing = comments.find(c => c.body.includes("CLAUDE.md validation failed"));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: message,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body: message,
                });
              }

              core.setFailed(errors.join(" | "));
            } else {
              console.log("CLAUDE.md validated: present and documents the code-review skill.");
            }

  validate-pr-description:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR description against template
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.pull_request.body || "").trim();
            const title = context.payload.pull_request.title || "";
            const branch = context.payload.pull_request.head.ref || "";

            // Pick the template to validate against based on the branch name prefix.
            // feature/ -> feature template, bugfix/ or fix/ -> bug template. Any
            // other prefix (refactor/, chore/, temp-*, etc.) skips template
            // validation — logged, not failed.
            let templateType;
            let templatePath;
            let requiredSections;
            if (branch.startsWith("feature/")) {
              templateType = "feature";
              templatePath = ".github/PULL_REQUEST_TEMPLATE/feature_template.md";
              requiredSections = ["Zoho Task ID", "Summary", "Changes"];
            } else if (branch.startsWith("bugfix/") || branch.startsWith("fix/")) {
              templateType = "bug";
              templatePath = ".github/PULL_REQUEST_TEMPLATE/bug_template.md";
              requiredSections = ["Zoho Task ID", "Summary", "Steps to Reproduce", "Changes"];
            } else {
              console.log(`Branch "${branch}" has no feature/, bugfix/, or fix/ prefix — skipping template validation.`);
              return;
            }

            // Zoho display key formats used in this project, e.g. UC2-T1634 or UC2-1520.
            const zohoTaskPattern = /[A-Z0-9]+-[A-Z]?\d{3,6}/;
            const errors = [];

            // 1. Description present at all
            if (body.length < 30) {
              errors.push("PR description is empty or too short.");
            }

            // 2. All required section headers exist.
            // Match each section as its own line, with or without leading "#"/"##"
            // markdown heading markers, case-insensitive. So both "## Summary" and
            // a plain "Summary" line are accepted.
            const escapeRegex = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const bodyLines = body.split("\n");
            const headingLineRe = h => new RegExp(`^\\s*#{0,6}\\s*${escapeRegex(h)}\\s*$`, "i");

            const missingSections = [];
            const emptySections = [];

            requiredSections.forEach(h => {
              const re = headingLineRe(h);
              const headingIndex = bodyLines.findIndex(line => re.test(line));
              if (headingIndex === -1) {
                missingSections.push(h);
                return;
              }

              // Find the next line (after the heading) that is itself one of the
              // other required section headers, marking the end of this section's
              // content. Everything in between must contain non-placeholder text.
              let nextHeadingIndex = bodyLines.length;
              for (let i = headingIndex + 1; i < bodyLines.length; i++) {
                const isAnotherHeading = requiredSections.some(other => headingLineRe(other).test(bodyLines[i]));
                if (isAnotherHeading) {
                  nextHeadingIndex = i;
                  break;
                }
              }

              const sectionContent = bodyLines
                .slice(headingIndex + 1, nextHeadingIndex)
                .join("\n")
                .replace(/<!--.*?-->/gs, "")
                .trim();

              if (sectionContent.length === 0) {
                emptySections.push(h);
              }
            });

            if (missingSections.length) {
              errors.push(`Missing required section(s): ${missingSections.join(", ")}`);
            }
            if (emptySections.length) {
              errors.push(`Section(s) left empty: ${emptySections.join(", ")}`);
            }

            // 3. Placeholder / template comments not left in
            if (/<!--.*-->/s.test(body.replace(/\n/g, " ")) && body.replace(/<!--.*?-->/gs, "").trim().length < 40) {
              errors.push("Template placeholders were not filled in — description is mostly HTML comments.");
            }

            // 4. Zoho task ID present somewhere in body or title
            if (!zohoTaskPattern.test(body) && !zohoTaskPattern.test(title)) {
              errors.push("No Zoho task ID (e.g. UC2-T1634 or UC2-1520) found in the PR title or 'Zoho Task ID' section.");
            }

            if (errors.length) {
              const message = [
                `### ❌ PR description validation failed (${templateType} template)`,
                "",
                ...errors.map(e => `- ${e}`),
                "",
                `Please update the PR description to follow \`${templatePath}\`.`
              ].join("\n");

              // Post/update a single comment instead of spamming a new one each run
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
              });
              const existing = comments.find(c => c.body.includes("PR description validation failed"));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: message,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body: message,
                });
              }

              core.setFailed(errors.join(" | "));
            } else {
              console.log(`PR description passed validation (${templateType} template).`);
            }
